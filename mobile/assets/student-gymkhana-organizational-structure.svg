<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="5400" height="1840" viewBox="0 0 5400 1840" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">IIT Jodhpur Student Gymkhana Organizational Structure</title>
<desc id="svgDesc">A vector recreation of the supplied Student Gymkhana hierarchy, including the Director and Dean of Student Affairs, President, Vice President, Student Senate, Constitutional Bodies, councils, committees, fests and subordinate roles.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L10,6 L1,11 z" fill="#626262" />
  </marker>
  <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
  </filter>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #252525; }
    .title { font-size: 42px; font-weight: 750; letter-spacing: .5px; fill: #291b45; }
    .subtitle { font-size: 23px; font-weight: 450; fill: #667085; }
    .connector { fill: none; stroke: #626262; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .connector-arrow { fill: none; stroke: #626262; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .node rect { stroke: #626262; stroke-width: 5; rx: 14; filter: url(#softShadow); }
    .node text { text-anchor: middle; dominant-baseline: middle; font-size: 23px; font-weight: 550; }
    .node.root text { font-size: 25px; font-weight: 650; }
    .node.small text { font-size: 19px; font-weight: 550; }
    .node.tiny text { font-size: 17px; font-weight: 550; }
    .node.white rect { fill: #ffffff; }
    .node.council rect { fill: #c5e2fb; }
    .node.head rect { fill: #d7f0d9; }
    .node.fest rect { fill: #fff0c7; }
    .node.grey rect { fill: #ededed; }
    .role-label { font-size: 19px; font-weight: 600; fill: #385b86; text-anchor: middle; }
    .legend-text { font-size: 18px; fill: #475467; }
    .node:focus rect, .node:hover rect { stroke: #7750b8; stroke-width: 8; }
  </style>
</defs>
